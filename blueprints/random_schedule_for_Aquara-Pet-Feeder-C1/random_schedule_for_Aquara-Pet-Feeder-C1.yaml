blueprint:
  name: Random Pet Feeder Schedule (Aqara C1 / Zigbee2MQTT)
  description: 'Generates a fresh, unpredictable feeding schedule every day and pushes
    it to the onboard memory of an Aqara Smart pet feeder C1 (ZNCWWSQ01LM) via Zigbee2MQTT
    over MQTT. Because the schedule lives on the device itself, a Home Assistant crash
    or outage cannot disrupt feeding.

    Each day, right after the feeding window closes (the trigger fires at a fixed
    daily time kept 5 minutes after window_end), the automation splits the window
    into `num_feeds` equal periods and picks one random minute in each — strictly
    inside (window_start, window_end) — enforcing min_gap (and max_gap when > 0; the
    gap limits win if they conflict with a period), then publishes the result to zigbee2mqtt/<device
    name>/set. It then waits up to 60 s for the device''s schedule sensor to change
    as confirmation; if that does not happen it raises a persistent notification warning
    that the feeder may still be running on the previous day''s schedule.

    IMPORTANT: the MQTT topic is derived from the device''s Home Assistant name, which
    must match its Zigbee2MQTT friendly name (true by default). Do not rename the
    feeder in Settings > Devices > & Services unless you also rename it in Zigbee2MQTT,
    or the publish will go to a non-existent topic.'
  domain: automation
  source_url: https://github.com/example/blueprints/raw/main/automation/random_feeder_schedule.yaml
  input:
    feeder_device:
      name: Feeder device
      description: The Aqara Smart pet feeder C1 (ZNCWWSQ01LM). Zigbee2MQTT devices
        enter Home Assistant through MQTT Discovery, so the owning integration is
        "mqtt" and the filter below lists all MQTT-discovered devices — pick your
        feeder from the list.
      selector:
        device:
          filter:
          - integration: mqtt
          multiple: false
    schedule_sensor:
      name: Schedule state sensor
      description: The Zigbee2MQTT sensor that mirrors the device's onboard schedule
        (e.g. sensor.petfeeder1_schedule). A change of this entity confirms the publish
        was accepted by the feeder.
      selector:
        entity:
          domain:
          - sensor
          multiple: false
          reorder: false
    window_start:
      name: Feeding window start
      description: Time of day the feeding window opens.
      default: 07:00:00
      selector:
        time: {}
    window_end:
      name: Feeding window end
      description: Time of day the feeding window closes. The new schedule is pushed
        to the device 5 minutes after this time, so today's (already finished) window
        is never disturbed; the random times take effect from the next day onward.
      default: '19:00:00'
      selector:
        time: {}
    num_feeds:
      name: Feeds per day
      description: How many feedings to schedule each day.
      default: 3
      selector:
        number:
          min: 1.0
          max: 12.0
          step: 1.0
          mode: box
    min_gap:
      name: Minimum gap (minutes)
      description: Minimum minutes between two consecutive feeds.
      default: 10
      selector:
        number:
          min: 1.0
          max: 720.0
          step: 1.0
          mode: box
    max_gap:
      name: Maximum gap (minutes)
      description: Maximum minutes between two consecutive feeds. 0 = no upper limit.
      default: 0
      selector:
        number:
          min: 0.0
          max: 720.0
          step: 1.0
          mode: box
    portion_size:
      name: Portion size
      description: Portions dispensed per feeding (the "size" field in the device
        schedule).
      default: 1
      selector:
        number:
          min: 1.0
          max: 255.0
          step: 1.0
          mode: box
    test_mode:
      name: Test mode
      description: When true, the generated schedule is only shown in a persistent
        notification and nothing is published to the device. Use this to preview the
        exact JSON payload before going live.
      default: false
      selector:
        boolean: {}
mode: single
max_exceeded: silent
triggers:
- trigger: time
  at: '21:05'
variables:
  feeder_device: !input feeder_device
  schedule_sensor: !input schedule_sensor
  window_start: !input window_start
  window_end: !input window_end
  num_feeds: !input num_feeds
  min_gap: !input min_gap
  max_gap: !input max_gap
  portion_size: !input portion_size
  test_mode: !input test_mode
  pre_publish_state: '{{ states(schedule_sensor) }}'
  schedule_payload: "{%- set ws = window_start.split(':') -%} {%- set we = window_end.split(':')
    -%} {%- set start_min = (ws[0]|int) * 60 + (ws[1]|int) -%} {%- set end_min = (we[0]|int)
    * 60 + (we[1]|int) -%} {%- set n = num_feeds | int -%} {%- set g_min = [min_gap|int,
    1] | max -%} {# max_gap=0 means \"no upper limit\"; otherwise clamp it up to min_gap
    so a\n   min>max misconfiguration can never produce an empty random range. #}\n{%-
    set raw_max = max_gap | int -%} {%- set g_max = [raw_max, g_min] | max if raw_max
    > 0 else 0 -%} {%- set G = n - 1 -%} {%- set ns = namespace(times=[]) -%} {%-
    if end_min - start_min <= 1 -%}\n  {# Degenerate window: no strictly-interior
    minute exists; feed at the start. #}\n  {%- set ns.times = [start_min] -%}\n{%-
    elif G * g_min > (end_min - 1) - (start_min + 1) -%}\n  {# Not enough room for
    the minimum gaps: fall back to even spacing. #}\n  {%- set first_min = start_min
    + 1 -%}\n  {%- set last_min = end_min - 1 -%}\n  {%- set span = [last_min - first_min,
    0] | max -%}\n  {%- for i in range(n) -%}\n    {%- set ns.times = ns.times + [first_min
    + (i * span) // G] -%}\n  {%- endfor -%}\n{%- else -%}\n  {# Equal-division jitter:
    split the interior window into n periods, one feed per period. #}\n  {%- set first_min
    = start_min + 1 -%}\n  {%- set last_min = end_min - 1 -%}\n  {%- set span = last_min
    - first_min -%}\n  {%- set gen = namespace(prev=None) -%}\n  {%- for i in range(n)
    -%}\n    {%- set lo = first_min + (i * span) // n -%}\n    {%- set hi = [first_min
    + ((i + 1) * span) // n - 1, last_min] | min -%}\n    {%- if gen.prev is none
    -%}\n      {%- set rlo = lo -%}\n      {%- set rhi = hi -%}\n    {%- else -%}\n
    \     {%- set rlo = [lo, gen.prev + g_min] | max -%}\n      {%- if g_max > 0 -%}\n
    \       {%- set rhi = [hi, gen.prev + g_max] | min -%}\n      {%- else -%}\n        {%-
    set rhi = hi -%}\n      {%- endif -%}\n    {%- endif -%}\n    {%- if rlo > rhi
    -%}\n      {# Gap limits conflict with this period (only when max_gap < period
    length): spill over. #}\n      {%- if gen.prev is none -%}\n        {%- set rlo
    = first_min -%}\n        {%- set rhi = last_min -%}\n      {%- else -%}\n        {%-
    set rlo = gen.prev + g_min -%}\n        {%- if g_max > 0 -%}\n          {%- set
    rhi = [last_min, gen.prev + g_max] | min -%}\n        {%- else -%}\n          {%-
    set rhi = last_min -%}\n        {%- endif -%}\n      {%- endif -%}\n    {%- endif
    -%}\n    {# Final safety net: the draw range must never be empty (e.g. when the\n
    \      minimum gap no longer fits before the window ends) - pin to the last\n
    \      interior minute instead of crashing the generator. #}\n    {%- if rlo >
    last_min -%}\n      {%- set rlo = last_min -%}\n      {%- set rhi = last_min -%}\n
    \   {%- elif rlo > rhi -%}\n      {%- set rhi = rlo -%}\n    {%- endif -%}\n    {%-
    set t = range(rlo, rhi + 1) | random -%}\n    {%- set gen.prev = t -%}\n    {%-
    set ns.times = ns.times + [t] -%}\n  {%- endfor -%}\n{%- endif -%} {%- set ens
    = namespace(entries=[]) -%} {%- for t in ns.times -%}\n  {%- set ens.entries =
    ens.entries + [{'days': 'everyday', 'hour': (t // 60)|int, 'minute': (t % 60)|int,
    'size': portion_size|int}] -%}\n{%- endfor -%} {{- {'schedule': ens.entries} |
    tojson -}}"
actions:
- if:
  - condition: template
    value_template: '{{ test_mode }}'
  then:
  - action: notify.persistent_notification
    data:
      title: Random feeder schedule (TEST MODE)
      message: 'Generated schedule for tomorrow (not published to the device): {{
        schedule_payload }}'
  else:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/{{ device_attr(feeder_device, 'name') }}/set
      payload: '{{ schedule_payload }}'
  - wait_for_trigger:
    - trigger: template
      value_template: '{{ states(schedule_sensor) != pre_publish_state }}'
    timeout:
      seconds: 60
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: notify.persistent_notification
      data:
        title: Feeder schedule update FAILED
        message: 'The feeder did not confirm the new schedule within 60 seconds, so
          it is likely still running on yesterday''s schedule. Payload that was published
          to zigbee2mqtt/{{ device_attr(feeder_device, ''name'') }}/set: {{ schedule_payload
          }}'
